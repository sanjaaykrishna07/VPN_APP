services:
  quantum-vpn-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantum-safe-vpn-gateway:latest
    container_name: quantum-safe-vpn-gateway
    restart: unless-stopped
    environment:
      PORT: "8888"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8888:8888"
    # Do not mount private keys or secrets into the container from source control.
